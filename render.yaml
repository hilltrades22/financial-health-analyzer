services:
  - type: web
    name: financial-health-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SEC_USER_AGENT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
